[package]
name = "rust-banner"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "Caller-owned application banners, localized build details, and safe command display"
license = "UPL-1.0"
repository = "https://github.com/marcuoli/rust-banner"
readme = "README.md"
include = ["src/**", "tests/**", "Cargo.toml", "Cargo.lock", "LICENSE", "README.md", "CHANGELOG.md", "docs/**", "scripts/**", "rust-toolchain.toml"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
time = { version = "0.3.55", default-features = false, features = ["formatting", "parsing"] }
url = "2.5.8"

unicode-general-category = "1.1.0"

icu_casemap = "2.4.0"
